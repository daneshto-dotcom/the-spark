# S16 P2 Step 1 — GitHub Pages deploy via the official Actions Pages path
# (actions/upload-pages-artifact@v5 + actions/deploy-pages@v5). Council R1
# Grok #4 + Gemini #2 adopted this over peaceiris/actions-gh-pages@v3 as
# GitHub's audited modern path.
#
# REQUIRED ONE-TIME USER STEP (per PRIME-AUDIT #2):
#   Settings → Pages → Source: select "GitHub Actions"
#   (NOT "Deploy from a branch" / "gh-pages")
#
# Live URL after first green run: https://daneshto-dotcom.github.io/the-spark/

name: Deploy to GitHub Pages

# S40 P2: paths filter so session-bookkeeping commits (.claude/, HANDOFF_*.md,
# reflexion_log.md, boot-snapshot.md) DON'T trigger deploys. Eliminates the
# cascade-cancel pattern where close/handoff/state-autocommit pushes within
# minutes of a code push would cancel the in-flight code deploy via the
# github-pages environment's built-in deployment concurrency (which overrides
# the workflow-level cancel-in-progress: false). Path list = exact set of
# files the `npm ci && npm run build` step reads: src/, public/, index.html,
# vite.config.ts, tsconfig.json, package*.json, plus this workflow file
# itself so changes here still trigger a verification deploy.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# PRIME-AUDIT #1: deploy-pages@v4 requires these permissions
permissions:
  contents: read
  pages: write
  id-token: write

# S40 P1 defensive measure: rename concurrency group from "pages" to
# "pages-deploy" in case stuck workflow-level concurrency state on the old
# group name was preventing runner scheduling (a fresh workflow_dispatch on
# unchanged code sat in pending for 14+ min with no jobs ever picked up,
# even after clearing the phantom github-pages deployment via deployment
# statuses API). cancel-in-progress remains false — we want session-close
# pushes to queue not cancel each other, and the paths filter above is what
# prevents non-code pushes from triggering at all.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # S131 P2 — this job had NO timeout, so it inherited GitHub's 6-hour default and a single hung
    # step could burn six hours of wall clock. e2e.yml already pairs every lane with a timeout; this
    # file was simply never given one. 15 min is ~7x the observed run (~2 min).
    #
    # ⚠ HONEST LIMIT: when timeout-minutes fires, GitHub SIGKILLs the step and the run concludes
    # `cancelled`, NOT `failure` — no failure email, and `gh run list` reads it as a benign
    # concurrency cancel. e2e.yml solves that by giving Playwright its own globalTimeout BELOW the
    # job timeout (PW_GLOBAL_TIMEOUT_MIN), so the TOOL ends the overrun and exits non-zero. Vitest
    # has no global-suite-timeout flag to do the same with, so this bounds the WASTE without fixing
    # the silent-signal class. Audit run CONCLUSIONS, not just the absence of failure mail.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ════════════════════════════════════════════════════════════════════════════════════════
      # S131 P2 — THE CI CARRIER. Until now this workflow gated on `npm run build` alone, so every
      # "vitest 1964/1964" figure in every handoff was LOCAL and self-reported with no mechanical
      # carrier. A red test could not stop a deploy. These two steps are that carrier.
      #
      # A NOTE ON WHAT WAS ACTUALLY MISSING, because the record had it wrong. The standing claim was
      # "NO CI job runs vitest OR typecheck — zero hits across .github/workflows/". That grep is
      # true and its conclusion is half false: package.json defines
      #   build = tsc -b && vite build && node scripts/check-bundle-size.mjs
      # so `npm run build` below ALREADY runs `tsc -b` and already enforces the bundle cap. A type
      # error has been failing this deploy all along, transitively. **vitest was the real gap.**
      # The typecheck step below is therefore not new coverage — it makes an INVISIBLE gate visible
      # and fails in seconds naming types as the reason, instead of surfacing as a generic build
      # failure minutes later.
      #
      # Ordering is cheapest-first: typecheck (seconds) → unit tests (~10 s) → full build (~2 min).
      # ════════════════════════════════════════════════════════════════════════════════════════
      - name: Typecheck (tsc -b --noEmit)
        run: npm run typecheck

      # ⚠ S141 — THIS WARNING WAS STALE IN THE OPPOSITE DIRECTION AND WAS STEERING CI DESIGN.
      # It said `npm test` is bare `vitest` (watch mode) and booked a `test:run` script as an open
      # carry-forward. Both are false: S133 already fixed package.json — `test` is `vitest run` and
      # the watch variant moved to `test:watch`. A maintainer "closing the carry-forward" would have
      # added a redundant script; one trusting the warning keeps hand-rolling `npx vitest run` in
      # every new lane forever. `npx vitest run` is kept here anyway — it is explicit about running
      # once and does not depend on a package script keeping its meaning — but it is now a CHOICE
      # rather than a workaround for a bug that no longer exists.
      - name: Unit tests (gating — a red test now blocks the deploy)
        run: npx vitest run

      # ════════════════════════════════════════════════════════════════════════════════════════
      # ⭐ S158 P1 — THE TURN CREDENTIALS HAVE TO REACH *THIS* BUILD, AND THEY DID NOT.
      #
      # S157 found the multiplayer root cause (the shipped TURN servers were dead, so the game ran
      # STUN-only and any pair behind strict NAT hung forever) and shipped `TURN_SETUP.md`, whose
      # step 4 says: put three values in a `.env` file, then "run a deploy — the values are baked in
      # at build time".
      #
      # ⛔ THAT RUNBOOK COULD NOT HAVE WORKED, AND THE REASON IS THIS FILE. `.env` is gitignored
      # (deliberately — a TURN credential in a public repo gets scraped for free bandwidth). This
      # workflow builds from a CLEAN `actions/checkout`, so the `.env` on the owner's disk does not
      # exist here. The build step below had no `env:` at all, and `gh secret list` / `gh variable
      # list` were both EMPTY. The owner would have done the five-minute signup, pushed, watched a
      # green deploy, and still been unable to reach his brother — with nothing on screen to say why.
      #
      # Vite inlines any `VITE_`-prefixed variable it finds in `process.env` at build time; verified
      # empirically at S158 boot by building with a probe value and grepping it back out of the
      # emitted bundle. So an `env:` block here is the whole fix.
      #
      # ⚠ UNSET IS A SUPPORTED STATE, NOT A FAILURE. An absent secret evaluates to the empty string,
      # `turnFromEnv()` in `src/net/iceConfig.ts` refuses a half-filled config, and the build ships
      # STUN-only exactly as it does today. Nothing here can break a deploy by being missing.
      #
      # ⚠ AND THE HONEST CAVEAT, RECORDED WHERE IT IS ACTED ON: a TURN credential consumed by a
      # BROWSER is public by construction — it is inlined into the bundle, and anyone can read it out
      # of the deployed JavaScript. That is not a leak introduced here, it is how browser WebRTC
      # works without a token server. Pick a provider with a hard quota cap so a scraper costs a
      # rate-limit rather than a bill. See TURN_SETUP.md § "Is it safe to put this in the game?".
      # ════════════════════════════════════════════════════════════════════════════════════════
      - name: TURN wiring report (booleans only — never the values)
        run: node scripts/turn-wiring-report.mjs
        env:
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS || secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Build (vite + tsc + bundle cap)
        run: npm run build
        env:
          # URLs are not secret, so they may live in a repo VARIABLE (readable in the UI, easier to
          # eyeball) — with a secret accepted as a fallback so three secrets also works.
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS || secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # v3->v5 bump: v4+ excludes hidden dotfiles by default (v3 included them).
          # Keep v3 behavior so any future dotfile (.nojekyll, .well-known/, etc.)
          # still ships. (.git/.github are excluded regardless.) Current dist/ has none.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # S131 P2 — same reasoning as the build job: no timeout meant the 6-hour default. This job is a
    # single Pages API call, so 10 min is already generous.
    timeout-minutes: 10
    # PRIME-AUDIT #1: environment binding required for deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
