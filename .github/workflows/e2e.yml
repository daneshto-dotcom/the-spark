# S46 P1 (BUG-CRITICAL-5) — Playwright 2-browser E2E harness CI workflow.
#
# ⛔ S142 — CORRECTED. This line used to read "Runs on every push to master + every PR",
# which the S127 note DIRECTLY BELOW already contradicted: S110 removed the per-push trigger.
# The file disagreed with itself six lines apart, and the wrong half came first.
# ACTUAL triggers (see the `on:` block): schedule + pull_request + workflow_dispatch.
#
# CONSEQUENCE, WORTH STATING PLAINLY BECAUSE IT BIT ON 2026-08-13: a push to master does NOT
# run these lanes, so the GATING `e2e` job can sit RED for an unbounded time with nobody
# notified. It was in fact red on clean master that day (worker-bots, 3/3 attempts) and the
# only reason anyone found out was a manual `gh workflow run`. If you change nothing else
# here, know that green-on-your-last-PR is not evidence that master is green now.
#
# Spec at e2e/smoke.spec.ts drives 2 separate Chromium contexts (= 2 WebRTC peers over real
# Trystero/Nostr signaling) and asserts the full lobby → match-start → place → bond flow.
#
# S127 — STALE DOC CORRECTED. This block used to claim "Path filter mirrors deploy.yml — skip
# e2e on session-bookkeeping commits (.claude/, HANDOFF_*.md, etc)". There is NO `paths:` key in
# the `on:` block below and there has not been one since S110 removed the per-push trigger: the
# triggers are schedule + pull_request + workflow_dispatch, none of which a bookkeeping commit
# fires. The filter is unnecessary rather than missing — but the comment described machinery that
# does not exist, which is exactly the stale-reference class a Rule-22 runtime audit scans for.
#
# S98 P1 — FLAKE QUARANTINE, split into separate JOBS (was two steps in one job).
# S126 — now THREE lanes: a slow SOAK lane was split off the gating lane (see below).
#   • job `e2e`            — GATING. Runs everything EXCEPT @quarantine-flaky, @soak,
#                            and @perf-measure. A red here == a real regression.
#   • job `e2e-soak`       — NON-GATING (for now). The 10k-tick heap/census audits +
#                            opt-in benchmarks. Split out in S126 because 3 soak tests
#                            were 15.2m of a 16.8m suite and made the 15m gating cap
#                            unmeetable — which silently killed the gate for 3+ weeks.
#   • job `e2e-quarantine` — NON-GATING. Runs ONLY @quarantine-flaky, the real
#                            multi-peer WebRTC tests that fail in the CI sandbox
#                            on net::ERR_ADDRESS_UNREACHABLE (it can't hold P2P
#                            data channels). It carries `continue-on-error: true`
#                            AT JOB LEVEL, so even when it fails/times out the
#                            workflow-run conclusion stays SUCCESS → no failure
#                            emails and it can never cancel/red the gating job.
#
#   Why a separate JOB, not a step: previously both lanes lived in one job, so
#   the quarantine lane's slow real-WebRTC retries (90–120s × playwright
#   retries:2) overran the single 15m cap → the WHOLE job was cancelled →
#   mooted the already-passed gating step → emailed the user. Separate jobs run
#   on separate runners with independent timeouts, so the quarantine lane is
#   fully isolated.
#
#   Quarantine = explicit opt-IN: a test GATES by default; you must add the
#   ` @quarantine-flaky` tag to its describe title to move it to the non-gating
#   job (Playwright --grep / --grep-invert match the full test title). The
#   quarantine job uses a separate --output dir + --reporter=list so it never
#   overwrites the gating lane's HTML report/traces and its flakes emit no
#   GitHub annotations. Deterministic transport is rejected (playwright.config
#   C9 + LOCKED_DECISIONS: real Trystero/Nostr P2P IS the surface under test);
#   de-flaking WebRTC-in-CI is tracked as a carry-forward, not done here.
#
#   master is currently NOT branch-protected (no required status checks), so the
#   gating signal is advisory; the job is named `e2e` so that if/when branch
#   protection is added, the required check can point at the gating job.

name: E2E (2-browser harness)

on:
  # S110 — REMOVED the per-push trigger. This 2-job Playwright harness ran ~35 min on EVERY push to
  # master and exhausted the repo's free GitHub Actions minutes — the spending-limit cap that
  # blocked all S110 deploys (startup_failure / 0 jobs) AND spammed failure emails (two per push: this
  # + the Pages deploy). It now runs on a WEEKLY schedule + on PRs + on-demand, catching regressions
  # without the per-push minute drain. The cheap deploy.yml (Pages, ~2 min) still runs on every push,
  # unchanged — so code still deploys on push. Run a one-off check anytime via the Actions tab →
  # "E2E (2-browser harness)" → Run workflow (workflow_dispatch).
  #
  # ⚠ S127 CORRECTION — DO NOT REASON FROM BILLED MINUTES HERE ANY MORE. This block used to say
  # "the PRIVATE repo's free minutes". Probed 2026-07-28: `gh repo view --json isPrivate,visibility`
  # → {"isPrivate": false, "visibility": "PUBLIC"} for daneshto-dotcom/the-spark. GitHub Actions
  # minutes are FREE AND UNLIMITED for public repos on standard runners, so the S110 minute-
  # exhaustion story is HISTORY, not a live constraint. It had already leaked into an S127 Council
  # round as a decisive argument for deleting the soak lane before the probe caught it. The real
  # remaining costs are wall-clock feedback latency, the 6h per-job ceiling, runner concurrency and
  # artifact storage — the weekly cadence above is retained on those grounds, not on minutes.
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC — weekly regression sweep
  pull_request:
    branches: [master]
  workflow_dispatch:

# E2E is independent of deploy; no shared concurrency group needed.
# Cancel in-progress runs on rapid pushes to save CI minutes. Both jobs share
# this group, so a new push cancels the whole in-progress run (cancelled != failed).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GATING lane — the FAST regression net: everything EXCEPT @quarantine-flaky, @soak,
  # and @perf-measure. A failure here is a REAL regression and reds the run.
  #
  # S126 — why the two extra exclusions exist. This lane used to run all 30 tests, but 3
  # of them (worker-heap ×2 + render-heap ×1, all 10k-tick soak audits) accounted for
  # 15.2m of a 16.8m local suite. It therefore could not fit ANY sane cap: the 15m
  # timeout SIGKILLed it on every weekly run from 2026-07-13 through -07-27 — 13 of 30
  # tests completed, 14 never started, and the run concluded `cancelled`, which reads as
  # a benign concurrency cancel and sends no failure email. Three weeks with no E2E
  # signal. The slow work now lives in `e2e-soak` on its own runner.
  #
  # Post-split this lane is ~25 tests / ~1.6m locally, so 18m is deliberate headroom for
  # a 2-core SwiftShader runner (observed ~3-5× slower than local).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # MUST stay strictly below timeout-minutes so PLAYWRIGHT ends an overrun, not the
      # runner — that is what flushes reporters and writes playwright-report/. See the
      # long note in playwright.config.ts.
      PW_GLOBAL_TIMEOUT_MIN: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (gating — excludes @quarantine-flaky)
        run: npm run e2e:gating
        env:
          CI: 'true'

      - name: Upload Playwright report (gating)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # SOAK / MEASUREMENT lane (S126) — the slow 10k-tick heap+census audits (@soak) plus
  # the opt-in benchmarks (@perf-measure). Runs on its OWN runner in PARALLEL with the
  # gating lane, so splitting it out costs no wall-clock; it simply stops 3 soak tests
  # from eating the fast lane's entire budget.
  #
  # `continue-on-error: true` is DELIBERATE and TEMPORARY. These audits have NEVER
  # executed on a GitHub runner — their thresholds were tuned on local hardware with a
  # real GPU (S123/S124), so gating on them today would install a permanent red rather
  # than a signal. The first runs are a MEASUREMENT, and their outcome is genuinely
  # unknown. Promotion to gating requires RETUNING the thresholds against observed
  # 2-core/SwiftShader numbers — NOT merely "a few green runs", which would be a
  # rubber-stamp. A failure here is still plainly visible as `X e2e-soak` in
  # `gh run view`; only the RUN-level conclusion ignores it.
  #
  # NOTE: @perf-measure tests self-skip unless SPARK_PERF=1, which is intentionally NOT
  # set here — enabling never-run benchmarks is out of scope for this priority. Routing
  # them is tidying, not a budget saving; the real cost is the 3 @soak tests.
  e2e-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    env:
      # Below timeout-minutes for the same reason as the gating lane: an overrun must
      # report as a failure WITH an uploaded report, never as a silent SIGKILL.
      PW_GLOBAL_TIMEOUT_MIN: 44
      # S127 — NO RETRIES IN THIS LANE (the global default is `retries: CI ? 2 : 0`).
      # A retry only helps a NON-deterministic failure. This lane's failure mode was
      # structural: sim ticks are FRAME-bound (src/main.ts:1389 clamps dt to 0.05s with
      # PHYSICS_HZ=60 ⇒ ≤3 ticks per rendered frame), so a tick shortfall on a 2-core
      # SwiftShader runner reproduces identically every attempt. In run 30374235685 that
      # burned ~21.2 of this lane's 44 minutes on 3 such attempts, and the globalTimeout
      # then cut the suite off before the last test finished. Expected lane time after
      # S127: ~20-25m. Gating + quarantine lanes leave this UNSET and keep retries: 2.
      PW_RETRIES: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (soak — @soak + @perf-measure, non-gating)
        run: npm run e2e:soak
        env:
          CI: 'true'

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-soak-results
          path: test-results-soak/
          retention-days: 14
          if-no-files-found: ignore

  # ⭐ S142 P2 — THE PROTOCOL-GATE LANE. GATING (no continue-on-error).
  #
  # THIS JOB EXISTS TO DELETE A RECURRING MANUAL CHORE. Every session close for many sessions
  # ended with "⚠ 2-PEER CHECK ON vN — ONLY YOU CAN DO THIS; CI cannot verify a protocol bump."
  # MEASURED 2026-08-13 (run 31707927282), that was FALSE: both real-WebRTC protocol-mismatch
  # tests PASSED IN CI, 5.6s each, covering BOTH direction arms (older peer and newer peer).
  # They produced no signal only because they live in smoke.spec.ts behind @quarantine-flaky,
  # which the gating lane grep-inverts and whose job is continue-on-error.
  #
  # WHY A SEPARATE JOB RATHER THAN PROMOTING THEM INTO THE GATING LANE. smoke.spec.ts carries an
  # explicit S98 P1 rule — every test in it is real Trystero/Nostr P2P, keep the tag — and S126
  # spent an entire session undoing the damage of flaky multi-peer tests reddening the main gate.
  # Isolating them keeps that rule intact: if a relay hiccups, THIS lane goes red and says exactly
  # what broke, without taking the 36-test gating lane down with it.
  #
  # Retries are left at the default (2) DELIBERATELY, unlike the quarantine lane above: a relay
  # hiccup is genuinely transient, which is the one case retries are for. Budget is not a concern
  # at ~11s of tests.
  #
  # ESCAPE HATCH, stated so nobody has to rediscover it: if this lane proves flaky in practice,
  # add `continue-on-error: true` here — do NOT delete it, and do NOT re-tag the tests. A noisy
  # signal is still strictly better than the manual chore it replaces.
  e2e-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Below timeout-minutes so Playwright ends an overrun and flushes results, per the
      # standing rule for every lane in this file.
      PW_GLOBAL_TIMEOUT_MIN: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (protocol mismatch — the 2-peer HELLO gate, GATING)
        run: npm run e2e:protocol
        env:
          CI: 'true'

      - name: Upload protocol-lane results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-protocol-results
          path: test-results-protocol/
          retention-days: 14
          if-no-files-found: ignore

  # NON-GATING quarantine lane — ONLY @quarantine-flaky (multi-peer real-WebRTC).
  # `continue-on-error: true` at JOB level => its failure/timeout NEVER fails the
  # workflow run (no failure emails); independent runner + timeout => it can never
  # cancel the gating job. It still RUNS + is visible (a consistent real regression
  # is still catchable) but cannot gate.
  e2e-quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      # S126 — below timeout-minutes so this lane also exits via Playwright (flushing its
      # results) instead of being SIGKILLed at the 20m cap, which is what happened on
      # every weekly run from 2026-07-13 onward.
      PW_GLOBAL_TIMEOUT_MIN: 17
      # ⛔ S142 P2 — RETRIES OFF, the exact S127 precedent from the soak lane.
      # MEASURED 2026-08-13 (run 31707927282): this lane ran 17.0m — the FULL cap — and
      # still finished "8 failed / 9 passed / 1 DID NOT RUN". The tests that fail here fail
      # STRUCTURALLY, so all three attempts fail identically and the two extra ones buy
      # nothing while costing 3x. That is what pushed the lane past its budget and left a
      # test unexecuted, which is ALSO why the lane reads as "fully red" in the backlog when
      # it is in fact roughly half green.
      PW_RETRIES: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (quarantine — @quarantine-flaky only, non-gating)
        run: npm run e2e:quarantine
        env:
          CI: 'true'

      - name: Upload quarantine results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-quarantine-results
          path: test-results-quarantine/
          retention-days: 14
          if-no-files-found: ignore
