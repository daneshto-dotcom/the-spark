<!doctype html>
<!-- PITCH MASTERS in the SPARK arcade. Source of truth: the Pitch Masters repo, web/spark/pitch-masters/. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pitch Masters · SPARK Arcade</title>
    <link rel="icon" href="/pitch-masters/game/index.icon.png" />
    <style>
      :root {
        --pm-bg: #0f1914;
        --pm-gold: #f2bf26;
        --pm-teal: #26a6b3;
        --pm-text: #e8efe9;
        --pm-dim: #8fa396;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--pm-bg);
        color: var(--pm-text);
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      #canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #pm-loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 16px;
        box-sizing: border-box;
        background:
          repeating-linear-gradient(90deg, rgba(31, 77, 36, 0.35) 0 7.14%, rgba(31, 77, 36, 0.2) 7.14% 14.28%),
          var(--pm-bg);
        z-index: 2;
      }
      #pm-loading h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 72px);
        letter-spacing: 0.04em;
        color: var(--pm-gold);
        text-shadow: 0 4px 0 #000;
        text-align: center;
      }
      #pm-loading p {
        margin: 0;
        color: var(--pm-dim);
        text-align: center;
      }
      #pm-bar {
        width: min(520px, 100%);
        height: 16px;
        border: 2px solid var(--pm-teal);
        border-radius: 10px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.5);
      }
      #pm-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--pm-teal), var(--pm-gold));
        transition: width 0.2s;
      }
      #pm-bar-fill.pm-indeterminate {
        animation: pm-slide 1.1s ease-in-out infinite;
      }
      @keyframes pm-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      #pm-status {
        min-height: 1.4em;
        color: var(--pm-text);
      }
      #pm-loading.pm-failed #pm-status {
        color: #ff8a7a;
        max-width: 560px;
      }
      #pm-back {
        color: var(--pm-dim);
        text-decoration: none;
        border: 2px solid #5a6570;
        border-radius: 10px;
        padding: 8px 18px;
      }
      #pm-back:hover {
        color: var(--pm-text);
        border-color: var(--pm-text);
      }
      #pm-build {
        position: absolute;
        bottom: 10px;
        right: 14px;
        font-size: 12px;
        color: #56645b;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0">Your browser does not support HTML5 canvas.</canvas>
    <div id="pm-loading">
      <h1>PITCH MASTERS</h1>
      <p>Real-time soccer card battler. First goal wins the round, best of 3.</p>
      <div id="pm-bar"><div id="pm-bar-fill"></div></div>
      <div id="pm-status">Starting…</div>
      <a id="pm-back" href="/">&larr; ARCADE</a>
      <div id="pm-build"></div>
    </div>
    <script type="module" src="/src/arcade/pitchMasters/page.ts"></script>
  </body>
</html>
